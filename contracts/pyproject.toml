[project]
name = "aaw-contracts"
version = "1.0.0"
description = "Shared versioned contracts for AAW services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
