# AAW 轻量开发（预置工作流）。格式说明见 docs/workflow-format.md。
format: aaw-workflow/1
id: aaw-dev
name: AAW 轻量开发
version: 1.0.0
description: 设计与开发由同一人完成的小需求：确认需求 → 设计与独立检查 → 测试设计 → 设计门禁 → 任务规划 → 逐任务实现、双人评审、代码扫描 → 最终交接。
root: main

entries:
  - id: dev
    label: 从需求开始
    description: 输入本次要做的事情，流程会先和你确认需求与边界。
    hint: 写下本次需求，可以用 @ 引用相关文件，Enter 开始运行
    start: requirement
    inputs:
      requirement:
        label: 本次需求
        required: true
        placeholder: 用一段话描述这次要完成的事情

stages:
  - id: design
    label: 需求与设计
    description: 确认需求和边界，落成经过独立检查的设计与测试设计，并通过设计门禁。
  - id: task
    label: 任务
    description: 把设计拆成有序任务，逐个实现并实际验证。
  - id: review
    label: 评审与处置
    description: 每个任务的改动做代码检查和双人独立评审，处置发现直到通过。
  - id: delivery
    label: 交付
    description: 核对证据、更新计划，最后汇总交接给用户。

# 初始变量：整改次数等计数器，供去向条件判断是否到达上限。
vars:
  designRepairs: 0
  gateRepairs: 0
  scanRepairs: 0
  reviewRepairs: 0
  forceRecheckA: false
  forceRecheckB: false
