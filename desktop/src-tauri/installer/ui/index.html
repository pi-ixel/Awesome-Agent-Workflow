<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AAW Desktop 安装与更新</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        padding: 0;
        min-height: 100vh;
        background: var(--window-bg);
      }
      .window {
        width: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        animation: none;
        background: radial-gradient(ellipse at 15% 25%, #ffffff0b, transparent 65%), radial-gradient(ellipse at 32% 65%, #bdbdbd08, transparent 60%), var(--window-bg);
        position: relative;
      }
      .layout {
        min-height: 100vh;
        padding-top: 30px;
      }
      .brand, .workspace {
        background: transparent;
        border: none;
      }
      .brand {
        overflow: visible;
      }
      .brand .aurora, .brand .grid {
        mask-image: linear-gradient(90deg, #000000 45%, transparent 100%);
      }
      .workspace {
        position: relative;
        z-index: 2;
      }
      .brand .aurora {
        filter: none;
        mask-image: none;
      }
      .brand .aurora-one {
        width: 460px;
        height: 440px;
        top: -100px;
        left: -150px;
        background: radial-gradient(ellipse, #eeeeee2b 0%, #bdbdbd14 35%, transparent 70%);
      }
      .brand .aurora-two {
        width: 400px;
        height: 420px;
        right: -160px;
        top: 50px;
        background: radial-gradient(ellipse, #bdbdbd1f 0%, #9494940d 35%, transparent 70%);
      }
      .titlebar {
        position: absolute;
        inset: 0 0 auto;
        height: 34px;
        display: flex;
        justify-content: flex-end;
        z-index: 5;
        user-select: none;
      }
      .titlebar button {
        display: grid;
        place-items: center;
        width: 42px;
        border: 0;
        background: transparent;
        color: #b1b1b1;
      }
      .titlebar button:hover { background: #ffffff12; color: white; }
      .titlebar #close:hover:not(:disabled) { background: #bf4151; }
      .titlebar button:disabled { opacity: .3; cursor: not-allowed; }
      .path-picker { display: flex; align-items: center; text-align: left; gap: 12px; width: 100%; }
      .path-picker span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .path-picker svg { flex-shrink: 0; color: var(--muted); }
      .path-picker:hover:not(:disabled) { border-color: #808080; background: #222222; }
      .primary:disabled {
        opacity: 0.55;
      }
      .track.indeterminate .fill {
        width: 35%;
        animation: sheen 2s linear infinite;
      }
      .error-text {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <main class="window" data-state="install">
      <div class="titlebar" id="titlebar" aria-label="窗口标题栏">
        <button id="minimize" aria-label="最小化" title="最小化">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 8h10" fill="none" stroke="currentColor" />
          </svg>
        </button>
        <button id="close" aria-label="关闭" title="关闭">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path d="m4 4 8 8m0-8-8 8" fill="none" stroke="currentColor" />
          </svg>
        </button>
      </div>
      <div class="layout">
        <section class="brand" aria-label="AAW 品牌动画">
          <canvas id="particles" aria-hidden="true"></canvas>
          <div class="aurora aurora-one"></div>
          <div class="aurora aurora-two"></div>
          <div class="grid"></div>
          <div class="emblem">
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>
            <div class="logo-core">
              <img src="logo.png" alt="AAW" />
              <div class="scan"></div>
            </div>
            <span class="spark spark-one"></span
            ><span class="spark spark-two"></span>
          </div>
          <div class="brand-copy">
            <p>你的智能协作工作区。</p>
          </div>
        </section>
        <section class="workspace">
          <div id="panel" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
