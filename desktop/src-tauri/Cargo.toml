[package]
name = "desktop"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rt 供 #[tokio::test]（进程语义的自动化测试，commands.rs / acp_process.rs）；
# net 供 auth_sso.rs 的回环 HTTP 测试
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "macros", "rt", "net"] }
# 企业 SSO 登录（auth_sso.rs）：rustls 避免 OpenSSL 平台链路，json 供后续扩展
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
sha2 = "0.10"
semver = "1"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
# 终端 PTY（terminal_pty.rs）：Windows ConPTY / POSIX openpty
portable-pty = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
