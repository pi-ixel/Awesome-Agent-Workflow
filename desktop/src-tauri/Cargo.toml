[package]
name = "desktop"
version = "0.1.15"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# rt 供 #[tokio::test]（进程语义的自动化测试，commands.rs / acp_process.rs）；
# net 供 auth_sso.rs 的回环 HTTP 测试
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "macros", "rt", "net"] }
# 更新与企业 SSO 共用 HTTP 特性；TLS 后端按平台选择。
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "system-proxy"] }
ring = "0.17"
sha2 = "0.10"
semver = "1"
regex = "1"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
# 终端 PTY（terminal_pty.rs）：Windows ConPTY / POSIX openpty
portable-pty = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Windows 使用 Schannel 和系统证书库，包含用户/企业安装的受信任证书。
[target.'cfg(windows)'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["native-tls"]

# 非 Windows 保留现有 Rustls 后端，避免额外引入 OpenSSL 构建依赖。
[target.'cfg(not(windows))'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
