name: dev-task-split
execution: skill
skill: [task-split]
prompt:
  inline: |
    本实例为 task-split 的【轻量模式】：本次工作流采用 dev 入口，唯一权威设计输入是
    .sdd/{SR}/dev-design.md，不存在《模块详细设计说明书》《模块测试用例设计》和
    《模块设计门禁结果》三件套，也不需要它们。不要因为缺少这三份文档而中止，
    也不要引导用户去执行 module-tobe-design / module-test-design / module-design-gate。

    load_skill task-split，按其轻量模式分支执行：以 dev-design.md 的方案、契约变更、
    影响面和验收标准为唯一事实来源，生成薄任务计划 .sdd/{SR}/tasks-overview.md。
    验收标准同时承担测试规格的角色。

    tasks-overview.md 必须保留标准格式契约：每个任务一个 `### T{N}` 小节，
    并预留由 task-dev 回填的 `- 状态：` 字段。不要生成 T1/T2 独立任务文件。

    完成后从任务计划表按串行顺序提取任务标题，构造 {"tasks":[...]} 传给 aaw done。
    提交前必须校验：tasks-overview.md 存在、任务列表非空、覆盖核对完整、
    Open Questions 为空；tasks 列表只包含标题，不含 T1/T2 前缀或 .md 后缀。
input:
  - path: ".sdd/{SR}/dev-design.md"
    required: true
  - path: ".sdd/{SR}/.context/dev-design-gate.md"
    required: false
output:
  - path: ".sdd/{SR}/tasks-overview.md"
    required: true
data_prompt:
  description: "从 tasks-overview.md 的任务计划表按串行顺序提取任务标题；列表项不要包含 T1/T2 前缀。"
