interface:
  display_name: "模块深度研究"
  short_description: "通过代码、Git 线索和补充问题持续刷新模块认知。"
  default_prompt: "使用 $module-deep-research 研究指定模块。通过 uv 运行 skill 自带的 deep_research.py，以 history-mode full 初始化；由 CLI 管理单任务调度、Git 提交反查、用户补充问题、增量刷新、运行预算、问题记录和 recheck。Git 历史只作为调查 hint，所有事实必须由当前 HEAD 取证。研究完成后仍接受 add-question 并重新审查。只读业务代码，只写 .sdd/modules/{模块名}/，持续执行到 CLI 返回 complete、paused 或 blocked。"
