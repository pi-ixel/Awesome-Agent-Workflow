name: Windows WebView2 memory benchmark

on:
  push:
    branches: [codex/webview2-memory-bench-20261121]
    paths:
      - "desktop/src-tauri/**"
      - "desktop/scripts/*webview2*.py"

permissions:
  contents: read

concurrency:
  group: windows-webview2-memory-bench
  cancel-in-progress: true

jobs:
  benchmark:
    name: Measure actual AAW WebViews
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --no-self-update
      - name: Prepare pinned Tauri patch
        run: python scripts/prepare-webview2-bench.py
      - name: Build frontend and prepare sidecar
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run workflow:build:debug
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build actual AAW Desktop executable
        run: cargo +stable build --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --features tauri/custom-protocol
      - name: Run 1 and 3 production sessions before and after
        run: |
          $exe = (Resolve-Path 'src-tauri/target/x86_64-pc-windows-msvc/debug/desktop.exe').Path
          $testRoot = Join-Path $env:RUNNER_TEMP ("aaw-webview2-bench-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $rows = @()
          foreach ($round in 1..3) {
            $modes = if ($round % 2) { @("isolated", "shared") } else { @("shared", "isolated") }
            foreach ($mode in $modes) {
              foreach ($sessions in @(1, 3)) {
                $arm = Join-Path $testRoot "$round-$mode-$sessions"
                New-Item -ItemType Directory -Path $arm | Out-Null
                $output = Join-Path $arm "result.json"
                $env:AAW_WEBVIEW2_SHARED_PROFILES = if ($mode -eq "shared") { "1" } else { "0" }
                $env:AAW_WEBVIEW2_BENCH_ROOT = Join-Path $arm "browser-data"
                $env:AAW_WEBVIEW2_BENCH_OUT = $output
                $env:AAW_WEBVIEW2_BENCH_SESSIONS = "$sessions"
                $env:AAW_WEBVIEW2_BENCH_SETTLE_MS = "5000"
                $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput (Join-Path $arm "stdout.txt") -RedirectStandardError (Join-Path $arm "stderr.txt")
                if (-not $p.WaitForExit(150000)) {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  throw "AAW benchmark timed out ($mode / $sessions)"
                }
                if (Test-Path $output) { Get-Content $output -Raw }
                if ($p.ExitCode -ne 0 -or -not (Test-Path $output)) {
                  Get-Content (Join-Path $arm "stdout.txt"), (Join-Path $arm "stderr.txt") -ErrorAction SilentlyContinue
                  throw "AAW benchmark failed ($mode / $sessions), exit code $($p.ExitCode)"
                }
                $rows += [ordered]@{ round = $round; mode = $mode; sessions = $sessions; actual = (Get-Content $output -Raw | ConvertFrom-Json) }
                Start-Sleep -Seconds 2
              }
            }
          }
          $json = $rows | ConvertTo-Json -Depth 12 -Compress
          Write-Output "AAW_BENCH_RESULT=$json"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### AAW WebView2 benchmark results"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('<pre>' + [System.Net.WebUtility]::HtmlEncode($json) + '</pre>')
